<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF 文件分析器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>CTF 文件分析器</h1>
            <p>上传文件开始分析。本工具将扫描隐藏数据、Flag以及其他CTF相关线索。</p>
        </header>

        <div class="upload-section">
            <form id="upload-form">
                <div id="drop-zone">
                    <p>拖拽文件至此或点击选择</p>
                    <input type="file" id="file-input" name="file" hidden>
                </div>
                <button type="submit" id="analyze-button">分析</button>
            </form>
        </div>

        <div id="loading-indicator" class="hidden">
            <div class="spinner"></div>
            <p>文件分析中，请稍候...</p>
        </div>

        <div id="error-display" class="hidden"></div>

        <div id="results-container" class="hidden">
            <div class="tab-nav">
                <button class="tab-link active" data-tab="tab-overview">文件总览</button>
                <button class="tab-link" data-tab="tab-findings">主要发现</button>
                <button class="tab-link" data-tab="tab-strings">提取字符串</button>
                <button class="tab-link" data-tab="tab-hex">十六进制预览</button>
            </div>

            <div id="tab-overview" class="tab-pane active">
                <div id="overview-content" class="card"></div>
            </div>
            <div id="tab-findings" class="tab-pane">
                <div id="findings-content" class="card"></div>
            </div>
            <div id="tab-strings" class="tab-pane">
                 <div id="strings-content" class="card">
                    <input type="text" id="string-filter" placeholder="筛选字符串...">
                    <ul id="strings-list"></ul>
                </div>
            </div>
            <div id="tab-hex" class="tab-pane">
                <div id="hex-content" class="card"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
