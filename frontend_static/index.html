<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTF 文件分析器</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>CTF 文件分析器</h1>
            <p>上传文件开始分析。本工具将扫描隐藏数据、Flag以及其他CTF相关线索。</p>
        </header>

        <div class="upload-section">
            <form id="upload-form">
                <div id="drop-zone">
                    <p>拖拽文件至此或点击选择</p>
                    <input type="file" id="file-input" name="file" hidden>
                </div>
                <button type="submit" id="analyze-button">分析</button>
            </form>
        </div>

        <div id="loading-indicator" class="hidden">
            <div class="spinner"></div>
            <p>文件分析中，请稍候...</p>
        </div>

        <div id="error-display" class="hidden"></div>

        <div id="results-container" class="hidden">
            <!-- General Info -->
            <section id="general-info" class="results-section">
                <h2>文件总览</h2>
                <div id="overview-content" class="card"></div>
            </section>

            <!-- Key Findings -->
            <section id="key-findings" class="results-section">
                <h2>主要发现</h2>
                <div id="findings-content" class="card"></div>
            </section>

            <!-- AI Analysis -->
            <section id="ai-analysis" class="results-section">
                <h2>AI 增强分析</h2>
                <div id="ai-analysis-content" class="card"></div>
            </section>

            <!-- Hex Preview -->
            <section id="hex-preview" class="results-section">
                <h2>十六进制与ASCII预览</h2>
                <div id="hex-content" class="card"></div>
            </section>

            <!-- Extracted Strings -->
            <section id="extracted-strings" class="results-section">
                <h2>提取字符串</h2>
                <div id="strings-content" class="card">
                    <input type="text" id="string-filter" placeholder="筛选字符串...">
                    <ul id="strings-list"></ul>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
